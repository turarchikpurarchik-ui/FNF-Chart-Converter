name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FNF_Chart_Converter main.py
      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist/FNF_Chart_Converter.exe package/
          Copy-Item README_RU.txt package/
          Compress-Archive -Path package/* -DestinationPath FNF_Chart_Converter_Windows.zip -Force
      - name: Upload EXE archive
        uses: actions/upload-artifact@v4
        with:
          name: FNF_Chart_Converter_Windows
          path: FNF_Chart_Converter_Windows.zip
